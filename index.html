<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리치마작 점수판</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#f2f4f3;background:#102522}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:820px;margin:auto}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}p,.hint{color:#b6cac4;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.badge{background:#274b43;border-radius:12px;padding:10px 16px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.seat{border:2px solid #31594e;border-radius:14px;padding:15px;background:#18352e}.seat.dealer{border-color:#e5bd66}.seat .name{font-size:17px;font-weight:700}.seat .score{font-size:27px;font-weight:800;margin:9px 0}.seat small{color:#c4d2cd}.controls{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#19362f;padding:17px;border-radius:15px;margin:12px 0}button,select,input{font:inherit;border-radius:9px;padding:11px 13px;border:1px solid #66867c;min-height:44px}button{background:#e6bb66;color:#1b2925;font-weight:750;cursor:pointer}button.secondary{background:#2c5146;color:#f4f5f1}button:disabled{opacity:.45;cursor:not-allowed}select,input{background:#102923;color:white;max-width:100%}label{display:flex;flex-direction:column;gap:5px;font-size:14px;margin:7px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>label{flex:1;min-width:125px}.hidden{display:none!important}.notice{margin-top:10px;color:#f4d79e;min-height:20px}ol{padding-left:23px;line-height:1.8;max-height:210px;overflow:auto}hr{border:0;border-top:1px solid #406157;margin:16px 0}@media(max-width:420px){body{padding:12px}.seat{padding:11px}.seat .score{font-size:22px}.badge{font-size:14px}}
</style></head><body><main><div class="top"><div><h1>🀄 리치마작 점수판</h1><p>동풍전 · 시작 25,000점 · 간이 점수표</p></div><div class="badge" id="round">동1국 · 0본장</div></div><div class="grid" id="seats"></div><div class="panel"><div class="top"><h2>리치 선언</h2><span class="hint" id="pot"></span></div><div class="row"><label>선언자<select id="riichiSeat"></select></label><button id="riichi">리치 (−1,000점)</button></div><p class="hint">리치봉은 공탁으로 보관하고 다음 화료자가 받습니다.</p></div><div class="panel"><h2>화료 정산</h2><div class="row"><label>화료자<select id="winner"></select></label><label>방식<select id="method"><option value="ron">론</option><option value="tsumo">쯔모</option></select></label><label id="loserWrap">방총자<select id="loser"></select></label><label>판수<select id="han"><option value="1">1판</option><option value="2">2판</option><option value="3">3판</option><option value="4">4판</option><option value="5">5판</option><option value="6">6판</option><option value="7">7판</option><option value="8">8판</option><option value="9">9판</option><option value="10">10판</option><option value="11">11판</option><option value="12">12판</option><option value="13">역만 (단일)</option></select></label></div><p class="hint">4~5판 만관 · 13판은 역만으로 처리 · 모든 일반 화료 30부 고정</p><button id="win">화료 확정 · 다음 국 진행</button><div class="notice" id="message" aria-live="polite"></div></div><div class="panel"><h2>유국 정산</h2><p>텐파이인 사람을 선택하세요. (0명 또는 4명이면 점수 이동 없음)</p><div class="row" id="tenpai"></div><div class="row"><button id="draw" class="secondary">유국 확정 · 다음 국 진행</button><button id="abort" class="secondary">도중 유국 (정산 없음)</button></div></div><div class="panel"><div class="top"><h2>진행 기록</h2><div class="controls"><button class="secondary" id="undo">되돌리기</button><button class="secondary" id="reset">새 게임</button></div></div><ol id="history"></ol><p class="hint">브라우저에 자동 저장됩니다. 다른 기기와는 동기화되지 않습니다.</p></div></main><script>
(()=>{'use strict';const KEY='riichi-house-scoreboard-v1', names=['동','남','서','북'];let s;const $=id=>document.getElementById(id);const initial=()=>({scores:[25000,25000,25000,25000],dealer:0,round:1,honba:0,pot:0,declared:[],history:[],ended:false});try{s=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(s.scores)||s.scores.length!==4||!Array.isArray(s.history))s=initial()}catch{s=initial()}let snapshots=[];const fmt=n=>n.toLocaleString('ko-KR');const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const label=i=>names[(i-s.dealer+4)%4]+'가';const who=i=>names[i];const opt=(el,exclude=-1)=>{const old=el.value;el.innerHTML='';for(let i=0;i<4;i++){if(i===exclude)continue;const o=document.createElement('option');o.value=i;o.textContent=who(i)+(i===s.dealer?' 👑':'');el.append(o)}if([...el.options].some(x=>x.value===old))el.value=old};const record=msg=>{s.history.unshift(msg);s.history=s.history.slice(0,100)};const checkpoint=()=>{snapshots.push(JSON.stringify(s));if(snapshots.length>40)snapshots.shift()};function next(keep){if(keep)s.honba++;else{s.dealer=(s.dealer+1)%4;s.round++;s.honba=0}if(s.round>4){s.ended=true;const max=Math.max(...s.scores);const first=s.scores.indexOf(max);if(s.pot){s.scores[first]+=s.pot*1000;record('종료: 남은 공탁 '+fmt(s.pot*1000)+'점 → '+who(first));s.pot=0}record('동풍전 종료')}s.declared=[]}function render(){const round=s.ended?'게임 종료':'동'+s.round+'국 · '+s.honba+'본장';$('round').textContent=round;$('pot').textContent='공탁 '+s.pot+'개 ('+fmt(s.pot*1000)+'점)';$('seats').innerHTML='';for(let i=0;i<4;i++){const e=document.createElement('div');e.className='seat'+(i===s.dealer?' dealer':'');const ri=s.declared.includes(i)?' · 리치 선언':'';e.innerHTML='<div class="name">'+who(i)+(i===s.dealer?' 👑':'')+'</div><div class="score">'+fmt(s.scores[i])+'점</div><small>'+ri.replace(/^ · /,'')+'</small>';$('seats').append(e)}opt($('riichiSeat'));opt($('winner'));opt($('loser'),Number($('winner').value));$('riichiSeat').disabled=s.ended;$('riichi').disabled=s.ended;$('win').disabled=s.ended;$('draw').disabled=s.ended;$('abort').disabled=s.ended;$('undo').disabled=!snapshots.length;$('history').innerHTML='';for(const item of s.history){const li=document.createElement('li');li.textContent=item;$('history').append(li)}if(!s.history.length)$('history').textContent='아직 기록이 없습니다.';$('loserWrap').classList.toggle('hidden',$('method').value==='tsumo');save()};const notify=t=>$('message').textContent=t;const table={1:[1000,300,500,1500,500],2:[2000,500,1000,2900,1000],3:[3900,1000,2000,5800,2000],4:[8000,2000,4000,12000,4000],5:[8000,2000,4000,12000,4000],6:[12000,3000,6000,18000,6000],7:[12000,3000,6000,18000,6000],8:[16000,4000,8000,24000,8000],9:[16000,4000,8000,24000,8000],10:[16000,4000,8000,24000,8000],11:[24000,6000,12000,36000,12000],12:[24000,6000,12000,36000,12000],13:[32000,8000,16000,48000,16000]};$('winner').addEventListener('change',()=>opt($('loser'),Number($('winner').value)));$('method').addEventListener('change',()=> $('loserWrap').classList.toggle('hidden',$('method').value==='tsumo'));$('riichi').addEventListener('click',()=>{const i=Number($('riichiSeat').value);if(s.declared.includes(i))return notify('이미 리치를 선언했습니다.');if(s.scores[i]<1000)return notify('리치봉 1,000점이 부족합니다.');checkpoint();s.scores[i]-=1000;s.pot++;s.declared.push(i);record('동'+s.round+'국 '+s.honba+'본장: '+who(i)+' 리치 (−1,000)');notify('리치 선언을 기록했습니다.');render()});$('win').addEventListener('click',()=>{const w=Number($('winner').value),m=$('method').value,l=Number($('loser').value),h=Number($('han').value);if(m==='ron'&&w===l)return notify('화료자와 방총자는 달라야 합니다.');const t=table[h];if(!t)return notify('판수를 선택하세요.');checkpoint();let gain=0;if(m==='ron'){const amount=(w===s.dealer?t[3]:t[0])+s.honba*300;s.scores[l]-=amount;gain=amount}else{for(let i=0;i<4;i++){if(i===w)continue;const amount=(w===s.dealer?t[4]:(i===s.dealer?t[2]:t[1]))+s.honba*100;s.scores[i]-=amount;gain+=amount}}s.scores[w]+=gain+s.pot*1000;const detail='동'+s.round+'국 '+s.honba+'본장: '+who(w)+' '+(m==='ron'?'론 ← '+who(l):'쯔모')+' '+(h===13?'역만':h+'판')+' +'+fmt(gain)+(s.pot?' (공탁 +'+fmt(s.pot*1000)+')':'');record(detail);const keep=w===s.dealer;s.pot=0;next(keep);notify(detail);render()});function finishDraw(abort){checkpoint();if(abort){record('동'+s.round+'국 '+s.honba+'본장: 도중 유국');next(true)}else{const checked=[...document.querySelectorAll('#tenpai input:checked')].map(x=>Number(x.value)),n=checked.length;if(n>0&&n<4){const receive=3000/n,pay=3000/(4-n);for(let i=0;i<4;i++)s.scores[i]+=checked.includes(i)?receive:-pay}record('동'+s.round+'국 '+s.honba+'본장: 유국 (텐파이 '+(checked.map(who).join(', ')||'없음')+')');next(checked.includes(s.dealer))}document.querySelectorAll('#tenpai input').forEach(x=>x.checked=false);notify('유국을 정산했습니다.');render()}$('draw').addEventListener('click',()=>finishDraw(false));$('abort').addEventListener('click',()=>finishDraw(true));$('undo').addEventListener('click',()=>{if(!snapshots.length)return;s=JSON.parse(snapshots.pop());notify('직전 작업을 되돌렸습니다.');render()});$('reset').addEventListener('click',()=>{if(!confirm('점수와 기록을 모두 지우고 새 게임을 시작할까요?'))return;s=initial();snapshots=[];notify('새 게임을 시작했습니다.');render()});for(let i=0;i<4;i++){const label=document.createElement('label');label.style.flexDirection='row';label.style.alignItems='center';label.style.gap='6px';const input=document.createElement('input');input.type='checkbox';input.value=i;input.style.width='20px';input.style.height='20px';label.append(input,document.createTextNode(who(i)));$('tenpai').append(label)}render()})();
</script></body></html>
